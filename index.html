
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My Job Application Tracker</h1>
        <p class="subtitle">Manage Your Job Applications</p>

        <div class="dashboard">
            <div class="card">
                <h3>Total Jobs</h3>
                <p id="totalJobs">0</p>
            </div>
            <div class="card">
                <h3>Interviews</h3>
                <p id="totalInterviews">0</p>
            </div>
            <div class="card">
                <h3>Selected</h3>
                <p id="totalSelected">0</p>
            </div>
        </div>

        <div class="form-box">
            <h2>Add New Job</h2>

            <form id="jobForm">

                <label>Company Name</label>
                <input type="text" id="company" required>

                <label>Job Position</label>
                <input type="text" id="position" required>

                <label>Applied Date</label>
                <input type="date" id="date" required>

                <label>Status</label>
                <select id="status">
                    <option>Applied</option>
                    <option>Interview</option>
                    <option>Selected</option>
                    <option>Rejected</option>
                </select>

                <button type="submit" id="submitBtn">
                    Add Job
                </button>

            </form>
        </div>

        <div class="jobs-box">
            <h2>My Job Applications</h2>

            <input type="text" id="search"
                placeholder="Search company or position">

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Position</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobList"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
